name: Layer 2 weekly (full-app e2e)

# Rung 5 drives SpecDesk.Host.exe over CDP against a disposable fixture repository.
# It needs a real window and the WebView2 runtime.
# The workflow runs weekly and on manual dispatch, outside the ordinary push and pull request checks.
# See docs/testing.md for the confirmation status of hosted Windows runs.
on:
  schedule:
    # Saturday at 03:17 UTC avoids the start of the hour.
    - cron: '17 3 * * 6'
  workflow_dispatch:

concurrency:
  group: layer2-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-app-e2e:
    name: e2e (Layer 2 - full app over CDP, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # One Node (pinned by webview/.nvmrc) for both the host build's BundleWebview target (invoked by
      # the dotnet build step below) and the e2e package itself; cache the npm store keyed on both
      # lockfiles, matching the e2e-webview job in ci.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: webview/.nvmrc
          cache: npm
          cache-dependency-path: |
            webview/package-lock.json
            e2e/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'nuget.config', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e

      # Playwright transpiles TS at run time WITHOUT type-checking (same rationale as the e2e-webview
      # job in ci.yml) — gate the full-app spec types explicitly before spending time on a real launch.
      - name: Typecheck e2e
        run: npm run typecheck
        working-directory: e2e

      # Build SpecDesk.Host ONCE here, with the exact recipe e2e/lib/app-process.ts's buildHost() uses
      # locally (`dotnet build … -c Debug`, webview bundled — no -p:SkipWebview). Each full-app spec
      # file's own beforeAll calls buildHost() again; E2E_SKIP_BUILD=1 on the run step below turns that
      # into a no-op so the host is built exactly once per job instead of once per spec file.
      - name: Build SpecDesk.Host (Debug, webview bundled)
        run: dotnet build src/SpecDesk.Host/SpecDesk.Host.csproj -c Debug

      # The real Photino/WebView2 window over CDP — see docs/testing.md for what this proves and the
      # first-run confirmation caveat. `npm run e2e:app` is required (never a bare `playwright test
      # --project=full-app`): its `--workers=1` is the real concurrency guard for the temp-run-dir sweep.
      - name: Run Layer 2 E2E (full-app over CDP)
        run: npm run e2e:app
        working-directory: e2e
        env:
          E2E_SKIP_BUILD: '1'

      # Failure artifacts include screenshots, geometry.json, trace-ring.json, and app-log.txt under artifacts/e2e.
      # Successful scenarios also produce final.png.
      # Artifacts from successful and failed runs support diagnosis without another run.
      - name: Upload Layer 2 E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: layer2-e2e-artifacts
          path: artifacts/e2e/**
          if-no-files-found: ignore
